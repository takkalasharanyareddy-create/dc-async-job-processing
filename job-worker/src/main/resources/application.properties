# Shared defaults. Activate with:
#   --spring.profiles.active=local
#   --spring.profiles.active=production
# or SPRING_PROFILES_ACTIVE env var.

spring.application.name=job-worker
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.main.web-application-type=none

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=false

# Parallel worker: keep up to pool-size jobs in flight
worker.pool-size=${WORKER_POOL_SIZE:5}
worker.max-attempts=${WORKER_MAX_ATTEMPTS:3}
worker.poll-interval-ms=${WORKER_POLL_INTERVAL_MS:500}
worker.processing-delay-ms=${WORKER_PROCESSING_DELAY_MS:3000}

logging.level.com.example.job=INFO
