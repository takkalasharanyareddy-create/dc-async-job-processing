spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=false

worker.pool-size=${WORKER_POOL_SIZE:5}
worker.max-attempts=${WORKER_MAX_ATTEMPTS:3}
worker.poll-interval-ms=${WORKER_POLL_INTERVAL_MS:500}
worker.processing-delay-ms=${WORKER_PROCESSING_DELAY_MS:3000}
worker.running-timeout-ms=${WORKER_RUNNING_TIMEOUT_MS:3600000}
worker.timeout-check-interval-ms=${WORKER_TIMEOUT_CHECK_INTERVAL_MS:60000}

logging.level.com.example.job=INFO
