# Local development — must match job-api H2 URL
spring.datasource.url=jdbc:h2:file:/workspaces/async-jobs/data/jobsdb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# validate only — job-api owns schema creation in local profile
spring.jpa.hibernate.ddl-auto=update

worker.pool-size=5
worker.max-attempts=3
worker.poll-interval-ms=500
worker.processing-delay-ms=3000
