# Shared defaults (profile-independent). Activate with:
#   --spring.profiles.active=local
#   --spring.profiles.active=production
# or SPRING_PROFILES_ACTIVE env var.

spring.application.name=job-api
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# API paths
# jobs-base-path is configurable; stream and by-id are fixed under it:
#   GET/POST  /api/jobs
#   GET       /api/jobs/{id}
#   GET       /api/jobs/stream   (SSE — fixed, does not change)
app.api.jobs-base-path=/api/jobs
app.api.ui-config-path=/api/ui-config

# SSE live dashboard
app.sse.poll-interval-ms=1000
app.sse.heartbeat-interval-ms=15000
spring.mvc.async.request-timeout=-1

# Common JPA / server defaults
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
logging.level.com.example.job=INFO
