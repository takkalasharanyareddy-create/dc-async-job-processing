# Local development profile
server.port=8080
server.servlet.context-path=

# Shared H2 file DB (same absolute path as job-worker local profile)
spring.datasource.url=jdbc:h2:file:/workspaces/async-jobs/data/jobsdb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# create = rebuild schema on startup (avoids stale H2 columns after entity changes)
spring.jpa.hibernate.ddl-auto=create
spring.flyway.enabled=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true


app.api.jobs-base-path=/api/jobs
