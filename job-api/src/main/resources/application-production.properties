# Production / deployable profile
# Override secrets via env vars — never commit real credentials.

server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_CONTEXT_PATH:}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Base path only (stream is fixed at {base}/stream)
app.api.jobs-base-path=${APP_API_JOBS_BASE_PATH:/api/jobs}

logging.level.com.example.job=INFO
logging.level.org.springframework.web=WARN
