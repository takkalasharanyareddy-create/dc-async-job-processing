services:
  postgres:
    image: postgres:16-alpine
    container_name: jobs-postgres
    environment:
      POSTGRES_DB: jobsdb
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: jobs
    ports:
      - "5432:5432"
    volumes:
      - jobs_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobs -d jobsdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jobs_pg_data:
